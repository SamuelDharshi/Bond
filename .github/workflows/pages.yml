name: Deploy web app to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bond/web build
        env:
          BCH_NETWORK: ${{ vars.BCH_NETWORK || 'chipnet' }}
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_DEMO_REPO: ${{ vars.VITE_DEMO_REPO }}
          VITE_BLAZE_URL: ${{ vars.VITE_BLAZE_URL }}
          # Public demo key (test network only). Stored as a secret just to keep it out of git.
          VITE_DEMO_MAINTAINER_WIF: ${{ secrets.VITE_DEMO_MAINTAINER_WIF }}
      - name: Single-page-app fallback (clean URLs)
        run: cp packages/web/dist/index.html packages/web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
