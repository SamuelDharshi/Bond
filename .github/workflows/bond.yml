name: Bond
on:
  issues:
    types: [opened, edited, labeled, reopened]
  pull_request_target:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  contents: read

concurrency:
  # One run per issue at a time (scheduled sweeps share one group) so a bond is never double-spent.
  group: bond-${{ github.event.issue.number || github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  bond:
    runs-on: ubuntu-latest
    # Ignore the bot's own comments.
    if: github.event_name != 'issue_comment' || github.event.comment.user.type != 'Bot'
    steps:
      - uses: actions/checkout@v4
      - id: key
        env:
          BOND_MAINTAINER_WIF: ${{ secrets.BOND_MAINTAINER_WIF }}
        run: |
          if [ -n "$BOND_MAINTAINER_WIF" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "BOND_MAINTAINER_WIF is not set yet; skipping."; fi
      - uses: ./packages/action
        if: steps.key.outputs.ok == 'true'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          maintainer-wif: ${{ secrets.BOND_MAINTAINER_WIF }}
          config-path: .github/bond.json
