name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:unit
      - run: pnpm check:network
      - run: pnpm lint
      # The committed bundle is built on a developer machine; byte-for-byte equality with a Linux build is not
      # guaranteed, so CI only proves that the bundle builds and is present.
      - name: Action bundle exists
        run: test -s packages/action/dist/index.js
